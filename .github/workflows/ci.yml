name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: test
        run: npm test
      - name: build the UI
        run: npm run build
