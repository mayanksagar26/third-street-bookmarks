<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks — X Archive</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --bg-elevated: #0f0f0f;
      --bg-hover: #080808;
      --border: #2f3336;
      --text-primary: #e7e9ea;
      --text-secondary: #71767b;
      --text-tertiary: #3e4347;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --like: #f91880;
      --repost: #00ba7c;
      --bookmark: #1d9bf0;
      --sidebar-width: 280px;
      --header-height: 53px;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 16px 0;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }

    .sidebar-logo {
      padding: 8px 20px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-logo svg { width: 28px; height: 28px; fill: var(--text-primary); }
    .sidebar-logo-text {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sidebar-section {
      padding: 4px 0 8px;
    }
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      padding: 8px 20px 6px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 20px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s;
      font-size: 14px;
      color: var(--text-primary);
      gap: 8px;
      text-decoration: none;
    }
    .sidebar-item:hover { background: var(--bg-hover); }
    .sidebar-item.active {
      color: var(--accent);
      font-weight: 600;
    }
    .sidebar-item-left { display: flex; align-items: center; gap: 10px; }
    .sidebar-badge {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1px 7px;
      min-width: 28px;
      text-align: center;
    }
    .sidebar-item.active .sidebar-badge {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .sidebar-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Bottom actions ── */
    .sidebar-bottom {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
      text-align: left;
    }
    .action-btn:hover { background: var(--bg-elevated); border-color: var(--text-secondary); }
    .action-btn.running {
      border-color: var(--accent);
      color: var(--accent);
      cursor: default;
    }
    .action-btn.done { border-color: var(--repost); color: var(--repost); }
    .action-btn.error { border-color: var(--like); color: var(--like); }
    .action-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .action-status {
      font-size: 11px;
      color: var(--text-secondary);
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .spin { animation: rotate 1s linear infinite; }

    /* ── Main ── */
    .main {
      flex: 1;
      min-width: 0;
      border-right: 1px solid var(--border);
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .header-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }
    .header-count {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* ── Search ── */
    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
    }
    .search-input {
      width: 100%;
      height: 36px;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      border-radius: 9999px;
      padding: 0 16px 0 38px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .search-input::placeholder { color: var(--text-secondary); }
    .search-input:focus {
      border-color: var(--accent);
      background: var(--bg);
    }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--text-secondary);
      color: var(--bg);
      border: none;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 11px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .search-clear.visible { display: flex; }

    /* ── Sort bar ── */
    .sort-bar {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 44px;
      border-bottom: 1px solid var(--border);
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sort-bar::-webkit-scrollbar { display: none; }
    .sort-btn {
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .sort-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .sort-btn.active { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); font-weight: 600; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      flex: 1;
      padding: 14px 16px;
      border-right: 1px solid var(--border);
      text-align: center;
    }
    .stat-item:last-child { border-right: none; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* ── Feed ── */
    .feed { }

    /* ── Tweet Card ── */
    .tweet-card {
      display: flex;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .tweet-card:hover { background: var(--bg-hover); }

    .tweet-avatar {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--bg-elevated);
      overflow: hidden;
    }
    .tweet-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .tweet-avatar-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
      color: var(--text-secondary);
      background: var(--bg-elevated);
    }

    .tweet-body { flex: 1; min-width: 0; }

    .tweet-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }
    .tweet-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tweet-name:hover { text-decoration: underline !important; }
    .tweet-handle {
      color: var(--text-secondary);
      font-size: 14px;
      white-space: nowrap;
    }
    .tweet-handle:hover { text-decoration: underline !important; }
    .tweet-date {
      color: var(--text-secondary);
      font-size: 13px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .tweet-text {
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tweet-text .highlight {
      background: rgba(29, 155, 240, 0.25);
      border-radius: 3px;
      padding: 0 1px;
    }

    .tweet-link-preview {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .tweet-link-preview:hover { border-color: #555; }
    .tweet-link-preview a {
      display: block;
      padding: 16px;
      color: inherit;
      text-decoration: none;
      background: var(--bg-elevated);
    }
    .link-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .link-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .link-domain {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .link-domain::before {
      content: '';
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 3px;
      background: var(--border);
      flex-shrink: 0;
    }

    .tweet-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tweet-category {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 9999px;
      border: 1px solid;
      font-weight: 500;
    }
    .tweet-meta {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .tweet-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }
    .tweet-action {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-secondary);
      font-size: 13px;
      transition: color 0.1s;
    }
    .tweet-action svg { width: 16px; height: 16px; }
    .tweet-action:hover { color: var(--accent); }
    .tweet-action.like:hover { color: var(--like); }
    .tweet-action.repost:hover { color: var(--repost); }
    .tweet-action.bookmark:hover { color: var(--bookmark); }

    /* ── Empty state ── */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-secondary);
    }
    .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 18px; color: var(--text-primary); margin-bottom: 6px; }

    /* ── Loading ── */
    .loading-spinner {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Right panel ── */
    .right-panel {
      width: 320px;
      flex-shrink: 0;
      padding: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .right-panel::-webkit-scrollbar { display: none; }

    .panel-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel-card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .top-author {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: opacity 0.1s;
    }
    .top-author:last-child { border-bottom: none; }
    .top-author:hover { background: var(--bg-hover); opacity: 1; }
    .top-author.active { background: rgba(29,155,240,0.08); }
    .top-author.active .top-author-name,
    .top-author.active .top-author-handle { color: var(--accent); }
    .top-author-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }
    .top-author-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .voices-list { max-height: 420px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .top-author-info { flex: 1; min-width: 0; }
    .top-author-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-author-handle { font-size: 13px; color: var(--text-secondary); }
    .top-author-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .page-btn {
      min-width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .page-btn:hover { background: var(--bg-elevated); }
    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .page-btn:disabled { opacity: 0.3; cursor: default; }
    .page-info { color: var(--text-secondary); font-size: 13px; }

    /* ── Read state ── */
    .tweet-card.is-read .tweet-name,
    .tweet-card.is-read .tweet-handle,
    .tweet-card.is-read .tweet-date,
    .tweet-card.is-read .tweet-text { color: var(--text-tertiary); }
    .tweet-card.is-read .tweet-categories { opacity: 0.35; }
    .tweet-card.is-read .tweet-actions { opacity: 0.3; }
    .tweet-card.is-read .tweet-avatar { opacity: 0.4; }

    /* ── Tweet top-right actions ── */
    .tweet-card { position: relative; cursor: default; }
    .tweet-card-actions {
      display: flex;
      align-items: center;
      gap: 1px;
      margin-left: auto;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tweet-card:hover .tweet-card-actions { opacity: 1; }
    .tw-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      padding: 4px 5px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
      position: relative;
    }
    .tw-btn:hover { background: rgba(255,255,255,0.06); }
    .tw-btn.read-btn:hover,
    .tw-btn.read-btn.active { color: var(--accent); }
    .tw-btn.star-btn:hover { color: #f59e0b; }
    .tw-btn.star-btn.active { color: #f59e0b; }
    .tw-btn svg { width: 15px; height: 15px; }

    /* ── Fav popup ── */
    .fav-popup {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      z-index: 9999;
      min-width: 210px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }
    .fav-popup-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      padding: 4px 8px 10px;
    }
    .fav-popup-folder {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-primary);
      transition: background 0.1s;
    }
    .fav-popup-folder:hover { background: rgba(255,255,255,0.06); }
    .fav-popup-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }
    .fav-popup-input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .fav-popup-input:focus { border-color: var(--accent); }
    .fav-popup-save {
      width: 100%;
      margin-top: 7px;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .fav-popup-save:hover { background: var(--accent-hover); }

    /* ── Category multi-select ── */
    .cat-search-wrap {
      padding: 4px 12px 6px;
      position: relative;
    }
    .cat-search-input {
      width: 100%;
      height: 30px;
      padding: 0 28px 0 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .cat-search-input:focus { border-color: var(--accent); }
    .cat-search-input::placeholder { color: var(--text-tertiary); }
    .cat-search-clear {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--text-secondary);
      color: var(--bg);
      border: none;
      border-radius: 50%;
      width: 15px; height: 15px;
      font-size: 9px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .cat-search-clear.visible { display: flex; }
    #category-list {
      max-height: 340px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .cat-item.active {
      color: var(--accent);
      font-weight: 600;
    }
    .cat-item.active .sidebar-badge {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .cat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 0 12px 8px;
    }
    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(29,155,240,0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(29,155,240,0.3);
      cursor: pointer;
      transition: background 0.1s;
    }
    .cat-chip:hover { background: rgba(29,155,240,0.22); }
    .cat-chip-x { font-size: 11px; opacity: 0.7; }
    .cat-clear-all {
      font-size: 11px;
      color: var(--text-secondary);
      padding: 0 12px 8px;
      cursor: pointer;
      text-decoration: underline;
      display: block;
    }
    .cat-clear-all:hover { color: var(--text-primary); }
    .cat-no-results {
      padding: 8px 20px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ── Sidebar favourites ── */
    .sidebar-fav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 20px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-primary);
      gap: 8px;
      transition: background 0.1s;
    }
    .sidebar-fav-item:hover { background: var(--bg-hover); }
    .sidebar-fav-item.active { color: #f59e0b; font-weight: 600; }
    .fav-badge {
      font-size: 12px;
      background: rgba(245,158,11,0.12);
      color: #f59e0b;
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 20px;
      padding: 1px 7px;
      min-width: 28px;
      text-align: center;
    }
    .sidebar-fav-item.active .fav-badge {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }

    /* ── View on X link ── */
    .view-on-x {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      transition: color 0.15s;
    }
    .view-on-x:hover { color: var(--accent); }

    /* ── Category colors ── */
    .cat-technology { color: #1d9bf0; border-color: rgba(29,155,240,0.4); background: rgba(29,155,240,0.08); }
    .cat-ai         { color: #a855f7; border-color: rgba(168,85,247,0.4); background: rgba(168,85,247,0.08); }
    .cat-business   { color: #f59e0b; border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.08); }
    .cat-science    { color: #10b981; border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.08); }
    .cat-design     { color: #f91880; border-color: rgba(249,24,128,0.4); background: rgba(249,24,128,0.08); }
    .cat-product    { color: #00ba7c; border-color: rgba(0,186,124,0.4); background: rgba(0,186,124,0.08); }
    .cat-startup    { color: #ff7b54; border-color: rgba(255,123,84,0.4); background: rgba(255,123,84,0.08); }
    .cat-engineering{ color: #60a5fa; border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.08); }
    .cat-finance    { color: #34d399; border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.08); }
    .cat-philosophy { color: #c084fc; border-color: rgba(192,132,252,0.4); background: rgba(192,132,252,0.08); }
    .cat-productivity{ color: #fbbf24; border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.08); }
    .cat-health     { color: #fb923c; border-color: rgba(251,146,60,0.4); background: rgba(251,146,60,0.08); }
    .cat-other      { color: var(--text-secondary); border-color: var(--border); background: transparent; }
    .cat-unclassified { color: var(--text-tertiary); border-color: var(--text-tertiary); background: transparent; display: none; }

    /* ── Scrollbar ── */
    .main { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* ── Responsive ── */
    @media (max-width: 1100px) { .right-panel { display: none; } }
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .stat-label { font-size: 10px; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      <span class="sidebar-logo-text">Bookmarks</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">Filter</div>
      <div class="sidebar-item active" data-filter="all" onclick="setFilter('all', this)">
        <span class="sidebar-item-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          All Bookmarks
        </span>
        <span class="sidebar-badge" id="badge-all">0</span>
      </div>
      <div class="sidebar-item" id="unread-toggle" onclick="toggleUnread(this)">
        <span class="sidebar-item-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
          Unread Only
        </span>
        <span class="sidebar-badge" id="badge-unread">0</span>
      </div>
    </div>

    <div class="sidebar-section" id="fav-section" style="display:none">
      <div class="sidebar-section-title">Favourites</div>
      <div class="sidebar-fav-item" data-filter="fav:all" onclick="setFilter('fav:all', this)">
        <span class="sidebar-item-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          All Favourites
        </span>
        <span class="fav-badge" id="badge-fav-all">0</span>
      </div>
      <div id="fav-folder-list"></div>
    </div>

    <div class="sidebar-section" id="categories-section">
      <div class="sidebar-section-title">Categories</div>
      <div class="cat-search-wrap">
        <input class="cat-search-input" id="cat-search" placeholder="Search categories…" oninput="onCatSearch(this.value)">
        <button class="cat-search-clear" id="cat-search-clear" onclick="clearCatSearch()" title="Clear">✕</button>
      </div>
      <div id="cat-chips"></div>
      <div id="category-list"></div>
    </div>

    <div class="sidebar-section" id="folders-section" style="display:none">
      <div class="sidebar-section-title">Folders</div>
      <div id="folder-list"></div>
    </div>

    <div style="flex:1"></div>
    <div class="sidebar-bottom">
      <button class="action-btn" id="btn-syncall" onclick="doSyncAll()">
        <svg viewBox="0 0 24 24" fill="currentColor" id="syncall-icon"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        Sync &amp; Classify
      </button>
      <div class="action-status" id="syncall-status"></div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main">
    <!-- Header / search -->
    <div class="header">
      <span class="header-title">Bookmarks</span>
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"/></svg>
        </span>
        <input
          class="search-input"
          id="search-input"
          type="text"
          placeholder="Search bookmarks..."
          oninput="onSearch(this.value)"
          onkeydown="if(event.key==='Escape')clearSearch()"
        />
        <button class="search-clear" id="search-clear" onclick="clearSearch()" title="Clear">✕</button>
      </div>
      <span class="header-count" id="result-count"></span>
    </div>

    <!-- Sort bar -->
    <div class="sort-bar">
      <button class="sort-btn active" data-sort="newest" onclick="setSort('newest',this)">Newest</button>
      <button class="sort-btn" data-sort="oldest" onclick="setSort('oldest',this)">Oldest</button>
      <button class="sort-btn" data-sort="likes" onclick="setSort('likes',this)">Most Liked</button>
      <button class="sort-btn" data-sort="bookmarks" onclick="setSort('bookmarks',this)">Most Bookmarked</button>
      <button class="sort-btn" data-sort="reposts" onclick="setSort('reposts',this)">Most Reposted</button>
      <button class="sort-btn" data-sort="author" onclick="setSort('author',this)">By Author</button>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="stats-bar" style="display:none">
      <div class="stat-item">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Bookmarks</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-authors">0</div>
        <div class="stat-label">Voices</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-years">0</div>
        <div class="stat-label">Years</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-categories">0</div>
        <div class="stat-label">Categories</div>
      </div>
    </div>

    <!-- Feed -->
    <div class="feed" id="feed">
      <div class="loading-spinner">
        <div class="spinner"></div>
        Loading bookmarks…
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination" style="display:none"></div>
  </main>

  <!-- Right panel -->
  <aside class="right-panel" id="right-panel">
    <div class="panel-card">
      <div class="panel-card-title">Voices</div>
      <div class="voices-list" id="top-authors"></div>
    </div>
  </aside>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let allBookmarks = [];
let filtered = [];
let currentFilter = 'all';
let currentSort = 'newest';
let currentPage = 1;
let searchQuery = '';
const PAGE_SIZE = 30;

// Read & Fav state (mirrors DB, loaded from bookmarks.json on init)
const readIds = new Set();
const favMap  = {};   // id → folderName
let favFolders = [];  // sorted list of distinct folder names

// Secondary filters (stack on top of currentFilter)
let currentVoice   = null;   // authorHandle or null
let showUnreadOnly = false;

// Category multi-select
const selectedCategories = new Set();
let _catCounts = {};          // cat → count, built once per data load
let _catSearchQ = '';         // search query within category list

// ── Category color map ─────────────────────────────────────────────────
const CAT_CLASS = {
  technology: 'cat-technology',
  tech: 'cat-technology',
  ai: 'cat-ai',
  'artificial intelligence': 'cat-ai',
  'machine learning': 'cat-ai',
  ml: 'cat-ai',
  business: 'cat-business',
  science: 'cat-science',
  design: 'cat-design',
  product: 'cat-product',
  startup: 'cat-startup',
  startups: 'cat-startup',
  engineering: 'cat-engineering',
  finance: 'cat-finance',
  philosophy: 'cat-philosophy',
  productivity: 'cat-productivity',
  health: 'cat-health',
};

function getCatClass(cat) {
  if (!cat || cat === 'unclassified') return 'cat-unclassified';
  const key = cat.toLowerCase().replace(/[^a-z ]/g, '').trim();
  return CAT_CLASS[key] || 'cat-other';
}

// ── Init ───────────────────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch('bookmarks.json');
    if (!res.ok) throw new Error('Failed to load bookmarks.json');
    allBookmarks = await res.json();
    loadLocalState();
    buildSidebar();
    buildFavSidebar();
    buildRightPanel();
    showStats();
    applyFilters();
  } catch (e) {
    document.getElementById('feed').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <h3>Could not load bookmarks</h3>
        <p>${e.message}</p>
        <p style="margin-top:8px;font-size:13px">Make sure bookmarks.json is in the same folder and you're serving this file (e.g. <code>npx serve .</code>)</p>
      </div>`;
  }
}

function loadLocalState() {
  readIds.clear();
  Object.keys(favMap).forEach(k => delete favMap[k]);
  allBookmarks.forEach(b => {
    if (b.isRead) readIds.add(b.id);
    if (b.favFolder) favMap[b.id] = b.favFolder;
  });
  favFolders = [...new Set(Object.values(favMap))].sort();
}

// ── Sidebar ────────────────────────────────────────────────────────────
function buildSidebar() {
  // Count categories
  const catCount = {};
  allBookmarks.forEach(b => {
    const cats = b.categories && b.categories.length ? b.categories : [b.primaryCategory || 'unclassified'];
    cats.forEach(c => {
      if (c && c !== 'unclassified') catCount[c] = (catCount[c] || 0) + 1;
    });
  });

  document.getElementById('badge-all').textContent = allBookmarks.length;
  const unreadCount = allBookmarks.filter(b => !readIds.has(b.id)).length;
  document.getElementById('badge-unread').textContent = unreadCount;

  _catCounts = catCount;
  renderCategoryList();

  // Folders
  const folderCount = {};
  allBookmarks.forEach(b => (b.folderNames||[]).forEach(f => { folderCount[f] = (folderCount[f]||0)+1; }));
  const folderSection = document.getElementById('folders-section');
  const folderList = document.getElementById('folder-list');
  if (Object.keys(folderCount).length) {
    folderSection.style.display = '';
    folderList.innerHTML = Object.entries(folderCount).sort((a,b)=>b[1]-a[1]).map(([f,c]) => `
      <div class="sidebar-item" data-filter="folder:${f}" onclick="setFilter('folder:${f}', this)">
        <span class="sidebar-item-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
          ${f}
        </span>
        <span class="sidebar-badge">${c}</span>
      </div>
    `).join('');
  }
}

function getCatDotColor(cat) {
  const map = {
    technology:'#1d9bf0',tech:'#1d9bf0',ai:'#a855f7','artificial intelligence':'#a855f7',
    'machine learning':'#a855f7',business:'#f59e0b',science:'#10b981',design:'#f91880',
    product:'#00ba7c',startup:'#ff7b54',startups:'#ff7b54',engineering:'#60a5fa',
    finance:'#34d399',philosophy:'#c084fc',productivity:'#fbbf24',health:'#fb923c',
  };
  return map[cat.toLowerCase()] || '#71767b';
}

// ── Category multi-select ──────────────────────────────────────────────

function renderCategoryList() {
  const sorted = Object.entries(_catCounts).sort((a, b) => b[1] - a[1]);
  const q = _catSearchQ;
  const visible = q ? sorted.filter(([cat]) => cat.toLowerCase().includes(q)) : sorted;

  // Selected always bubble to top
  const sel  = visible.filter(([cat]) => selectedCategories.has(cat));
  const rest = visible.filter(([cat]) => !selectedCategories.has(cat));
  const ordered = [...sel, ...rest];

  const catList = document.getElementById('category-list');
  if (!ordered.length) {
    catList.innerHTML = `<div class="cat-no-results">No categories match</div>`;
    return;
  }
  catList.innerHTML = ordered.map(([cat, count]) => {
    const isSelected = selectedCategories.has(cat);
    return `
      <div class="sidebar-item cat-item${isSelected ? ' active' : ''}" onclick="toggleCategory('${cat}')">
        <span class="sidebar-item-left">
          <span class="sidebar-dot" style="background:${getCatDotColor(cat)}"></span>
          ${cap(cat)}
        </span>
        <span class="sidebar-badge">${count}</span>
      </div>`;
  }).join('');
}

function renderCatChips() {
  const wrap = document.getElementById('cat-chips');
  if (!selectedCategories.size) { wrap.innerHTML = ''; return; }
  const chips = [...selectedCategories].map(cat => `
    <span class="cat-chip" onclick="toggleCategory('${cat}')">
      ${cap(cat)}<span class="cat-chip-x">×</span>
    </span>`).join('');
  wrap.innerHTML = `<div class="cat-chips">${chips}</div>
    <span class="cat-clear-all" onclick="clearCatSelection()">Clear all</span>`;
}

function toggleCategory(cat) {
  if (selectedCategories.has(cat)) selectedCategories.delete(cat);
  else selectedCategories.add(cat);
  currentPage = 1;
  renderCategoryList();
  renderCatChips();
  applyFilters();
}

function clearCatSelection() {
  selectedCategories.clear();
  currentPage = 1;
  renderCategoryList();
  renderCatChips();
  applyFilters();
}

function onCatSearch(val) {
  _catSearchQ = val.trim().toLowerCase();
  document.getElementById('cat-search-clear').classList.toggle('visible', !!val);
  renderCategoryList();
}

function clearCatSearch() {
  document.getElementById('cat-search').value = '';
  onCatSearch('');
}

// ── Right panel ────────────────────────────────────────────────────────
function buildRightPanel() {
  const authorCount = {};
  const authorMeta = {};
  allBookmarks.forEach(b => {
    authorCount[b.authorHandle] = (authorCount[b.authorHandle]||0)+1;
    if (!authorMeta[b.authorHandle]) authorMeta[b.authorHandle] = { name: b.authorName, img: b.authorProfileImageUrl };
  });
  const all = Object.entries(authorCount).sort((a,b)=>b[1]-a[1]);
  document.getElementById('top-authors').innerHTML = all.map(([handle, count]) => {
    const meta = authorMeta[handle] || {};
    const isActive = currentVoice === handle;
    return `
      <div class="top-author${isActive?' active':''}" data-handle="${esc(handle)}" onclick="filterByAuthor('${esc(handle)}')">
        <div class="top-author-avatar">
          ${meta.img ? `<img src="${meta.img}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="top-author-info">
          <div class="top-author-name">${esc(meta.name || handle)}</div>
          <div class="top-author-handle">@${handle}</div>
        </div>
        <div class="top-author-count">${count}</div>
      </div>`;
  }).join('');
}

function filterByAuthor(handle) {
  currentVoice = currentVoice === handle ? null : handle;
  // Patch active classes in place
  document.querySelectorAll('.top-author').forEach(el => {
    el.classList.toggle('active', el.dataset.handle === currentVoice);
  });
  currentPage = 1;
  applyFilters();
}

// ── Stats ──────────────────────────────────────────────────────────────
function showStats() {
  document.getElementById('stat-total').textContent = fmt(allBookmarks.length);
  const authors = new Set(allBookmarks.map(b=>b.authorHandle)).size;
  document.getElementById('stat-authors').textContent = fmt(authors);
  const dates = allBookmarks.map(b=>b.postedAt).filter(Boolean).map(d=>new Date(d).getFullYear()).filter(y=>!isNaN(y));
  const years = dates.length ? Math.max(...dates) - Math.min(...dates) + 1 : 0;
  document.getElementById('stat-years').textContent = years;
  const cats = new Set(allBookmarks.map(b=>b.primaryCategory).filter(c=>c&&c!=='unclassified')).size;
  document.getElementById('stat-categories').textContent = cats;
  document.getElementById('stats-bar').style.display = '';
}

// ── Filtering & sorting ────────────────────────────────────────────────
function setFilter(filter, el) {
  if (currentFilter === filter && filter !== 'all') {
    // Toggle off → back to all
    currentFilter = 'all';
    document.querySelectorAll('.sidebar-item, .sidebar-fav-item').forEach(e => e.classList.remove('active'));
    document.querySelector('.sidebar-item[data-filter="all"]').classList.add('active');
  } else {
    currentFilter = filter;
    document.querySelectorAll('.sidebar-item, .sidebar-fav-item').forEach(e => e.classList.remove('active'));
    if (el) el.classList.add('active');
  }
  currentPage = 1;
  applyFilters();
}

function toggleUnread(el) {
  showUnreadOnly = !showUnreadOnly;
  el.classList.toggle('active', showUnreadOnly);
  currentPage = 1;
  applyFilters();
}

function setSort(sort, el) {
  currentSort = sort;
  currentPage = 1;
  document.querySelectorAll('.sort-btn').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function onSearch(q) {
  searchQuery = q.trim().toLowerCase();
  currentPage = 1;
  document.getElementById('search-clear').classList.toggle('visible', !!q);
  applyFilters();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  onSearch('');
}

function applyFilters() {
  let result = allBookmarks.slice();

  // Category multi-select (independent of currentFilter)
  if (selectedCategories.size > 0) {
    result = result.filter(b => {
      const cats = b.categories && b.categories.length ? b.categories : [b.primaryCategory];
      return cats.some(c => selectedCategories.has(c));
    });
  }

  // Main filter: fav / folder (cat: no longer goes here)
  if (currentFilter !== 'all') {
    if (currentFilter.startsWith('folder:')) {
      const folder = currentFilter.slice(7);
      result = result.filter(b => (b.folderNames||[]).includes(folder));
    } else if (currentFilter === 'fav:all') {
      result = result.filter(b => favMap[b.id]);
    } else if (currentFilter.startsWith('fav:')) {
      const folder = currentFilter.slice(4);
      result = result.filter(b => favMap[b.id] === folder);
    }
  }

  // Voice filter (stacks on top of category/fav filter)
  if (currentVoice) {
    result = result.filter(b => b.authorHandle === currentVoice);
  }

  // Unread filter (stacks on everything)
  if (showUnreadOnly) {
    result = result.filter(b => !readIds.has(b.id));
  }

  // Search
  if (searchQuery) {
    const q = searchQuery;
    result = result.filter(b =>
      (b.text||'').toLowerCase().includes(q) ||
      (b.authorHandle||'').toLowerCase().includes(q.replace('@','')) ||
      (b.authorName||'').toLowerCase().includes(q) ||
      (b.articleTitle||'').toLowerCase().includes(q) ||
      (b.primaryCategory||'').toLowerCase().includes(q)
    );
  }

  // Sort
  result = sortBookmarks(result, currentSort);

  filtered = result;
  document.getElementById('result-count').textContent =
    filtered.length !== allBookmarks.length ? `${fmt(filtered.length)} results` : '';
  renderPage();
}

function sortBookmarks(list, sort) {
  const copy = list.slice();
  if (sort === 'newest') return copy.sort((a,b) => parseDate(b.postedAt) - parseDate(a.postedAt));
  if (sort === 'oldest') return copy.sort((a,b) => parseDate(a.postedAt) - parseDate(b.postedAt));
  if (sort === 'likes') return copy.sort((a,b) => (b.likeCount||0) - (a.likeCount||0));
  if (sort === 'bookmarks') return copy.sort((a,b) => (b.bookmarkCount||0) - (a.bookmarkCount||0));
  if (sort === 'reposts') return copy.sort((a,b) => (b.repostCount||0) - (a.repostCount||0));
  if (sort === 'author') return copy.sort((a,b) => (a.authorHandle||'').localeCompare(b.authorHandle||''));
  return copy;
}

// ── Render ─────────────────────────────────────────────────────────────
function renderPage() {
  const start = (currentPage-1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  const feed = document.getElementById('feed');

  if (!filtered.length) {
    feed.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <h3>No results</h3>
        <p>Try a different search or filter</p>
      </div>`;
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  feed.innerHTML = page.map(b => renderTweet(b)).join('');
  renderPagination();
}

function renderTweet(b) {
  const handle = esc(b.authorHandle || '');
  const name = esc(b.authorName || handle);
  const date = formatDate(b.postedAt);
  const addedDate = formatBookmarkAdded(b.bookmarkedAt || b.syncedAt);
  const text = highlightSearch(esc(b.text || ''), searchQuery);
  const avatar = b.authorProfileImageUrl
    ? `<img src="${b.authorProfileImageUrl}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="tweet-avatar-placeholder">${(b.authorName||b.authorHandle||'?')[0].toUpperCase()}</div>`;

  const cats = (b.categories && b.categories.length ? b.categories : (b.primaryCategory && b.primaryCategory !== 'unclassified' ? [b.primaryCategory] : []));
  const catBadges = cats.length ? `<div class="tweet-categories">${cats.slice(0,4).map(c => `<span class="tweet-category ${getCatClass(c)}">${esc(cap(c))}</span>`).join('')}</div>` : '';

  const isRead = readIds.has(b.id);
  const favFolder = favMap[b.id] || null;
  const isStarred = !!favFolder;

  const li = fmt(b.likeCount||0);

    : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>`;

  const starIcon = isStarred
    ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;

  const starTitle = isStarred ? `Saved in "${favFolder}" — click to remove` : 'Add to favourites';

  return `
<div class="tweet-card${isRead ? ' is-read' : ''}" data-id="${b.id}">
  <a class="tweet-avatar" href="https://x.com/${esc(b.authorHandle||'')}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${avatar}</a>
  <div class="tweet-body">
    <div class="tweet-header">
      <a class="tweet-name" href="https://x.com/${esc(b.authorHandle||'')}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="text-decoration:none;color:inherit">${name}</a>
      <a class="tweet-handle" href="https://x.com/${esc(b.authorHandle||'')}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="text-decoration:none">@${handle}</a>
      <span class="tweet-date">${date}</span>
      <div class="tweet-card-actions">
        <button class="tw-btn read-btn${isRead ? ' active' : ''}" title="${isRead ? 'Mark as unread' : 'Mark as read'}" onclick="toggleRead(event,'${b.id}')">${readIcon}</button>
        <button class="tw-btn star-btn${isStarred ? ' active' : ''}" title="${starTitle}" onclick="toggleFav(event,'${b.id}')">${starIcon}</button>
      </div>
    </div>
    <div class="tweet-text">${linkify(text)}</div>
    ${catBadges}
    ${addedDate ? `<div class="tweet-meta">Added ${addedDate}</div>` : ''}
    <div class="tweet-actions">
      <span class="tweet-action">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 7.879 3.77 7.879 8.004 0 3.783-2.96 7.292-6.893 7.92a.5.5 0 01-.579-.49v-1.79c0-.145-.049-.274-.13-.373-.12-.146-.322-.197-.51-.146a8 8 0 01-2.147.298c-4.421 0-7.991-3.58-7.991-8.003z"/></svg>
        ${re}
      </span>
      <span class="tweet-action repost">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>
        ${rt}
      </span>
      <span class="tweet-action like">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>
        ${li}
      </span>
      <span class="tweet-action bookmark">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.56l6-4.29 6 4.29V4.5c0-.28-.224-.5-.5-.5h-11z"/></svg>
        ${bm}
      </span>
      <a class="view-on-x" href="${esc(b.url||'#')}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        View
      </a>
    </div>
  </div>
</div>`;
}

// ── Pagination ─────────────────────────────────────────────────────────
function renderPagination() {
  const total = filtered.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const pg = document.getElementById('pagination');

  if (totalPages <= 1) { pg.style.display = 'none'; return; }
  pg.style.display = 'flex';

  let pages = [];
  pages.push(1);
  if (currentPage > 3) pages.push('...');
  for (let i = Math.max(2, currentPage-1); i <= Math.min(totalPages-1, currentPage+1); i++) pages.push(i);
  if (currentPage < totalPages-2) pages.push('...');
  if (totalPages > 1) pages.push(totalPages);

  pg.innerHTML = `
    <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>←</button>
    ${pages.map(p => p==='...'
      ? `<span class="page-info">…</span>`
      : `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`
    ).join('')}
    <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>→</button>
    <span class="page-info">&nbsp;${fmt((currentPage-1)*PAGE_SIZE+1)}–${fmt(Math.min(currentPage*PAGE_SIZE,total))} of ${fmt(total)}</span>
  `;
}

function goPage(p) {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > total) return;
  currentPage = p;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Helpers ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }
function fmt(n) { return Number(n||0).toLocaleString(); }
function parseDate(s) { try { return new Date(s).getTime()||0; } catch { return 0; } }
function formatDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    if (isNaN(d)) return '';
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return `${Math.floor(diff)}s`;
    if (diff < 3600) return `${Math.floor(diff/60)}m`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h`;
    if (diff < 86400*7) return `${Math.floor(diff/86400)}d`;
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:d.getFullYear()!==now.getFullYear()?'numeric':undefined});
  } catch { return ''; }
}
function formatBookmarkAdded(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch { return ''; }
}
function getDomain(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch { return url; }
}
function linkify(text) {
  // Turn plain URLs into clickable <a> tags (after escaping, so safe)
  return text.replace(/(https?:\/\/[^\s<>"]+|(?:www\.|[a-z0-9-]+\.(?:com|io|ai|dev|org|net|co|app|sh|gg|xyz|me|to|be))[^\s<>"]*)/gi, url => {
    const href = url.startsWith('http') ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="color:var(--accent);text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${url}</a>`;
  });
}
function highlightSearch(text, q) {
  if (!q || q.length < 2) return text;
  try {
    const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    return text.replace(re, '<span class="highlight">$1</span>');
  } catch { return text; }
}

// ── Read / Favourite ───────────────────────────────────────────────────

async function toggleRead(e, id) {
  e.stopPropagation();
  e.preventDefault();
  try {
    const r = await fetch(`/api/read/${id}`, { method: 'POST' });
    const d = await r.json();
    if (d.isRead) readIds.add(id);
    else readIds.delete(id);
    // Patch the card in-place without full re-render
    const card = document.querySelector(`.tweet-card[data-id="${id}"]`);
    if (card) {
      card.classList.toggle('is-read', d.isRead);
      const btn = card.querySelector('.read-btn');
      if (btn) {
        btn.classList.toggle('active', d.isRead);
        btn.title = d.isRead ? 'Mark as unread' : 'Mark as read';
        btn.innerHTML = d.isRead
          ? `<svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`
          : `<svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>`;
      }
    }
  } catch(err) { /* silent */ }
}

let _openPopupId = null;

function toggleFav(e, id) {
  e.stopPropagation();
  e.preventDefault();
  closeAllPopups();
  if (favMap[id]) {
    // Already starred — remove immediately
    saveFav(id, null);
    return;
  }
  // Show folder popup
  _openPopupId = id;
  const btn = document.querySelector(`.tweet-card[data-id="${id}"] .star-btn`);
  if (!btn) return;
  const popup = buildFavPopup(id);
  btn.appendChild(popup);
  const input = document.getElementById(`fav-input-${id}`);
  if (input) setTimeout(() => input.focus(), 50);
}

function buildFavPopup(id) {
  const div = document.createElement('div');
  div.className = 'fav-popup';
  div.addEventListener('click', e => e.stopPropagation());

  // Use event delegation so folder names with spaces work fine
  div.addEventListener('click', e => {
    const folderEl = e.target.closest('[data-fav-folder]');
    if (folderEl) saveFav(id, folderEl.dataset.favFolder);
  });

  let inner = `<div class="fav-popup-title">Save in</div>`;
  if (favFolders.length) {
    inner += favFolders.map(f => `
      <div class="fav-popup-folder" data-fav-folder="${f.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
        ${esc(f)}
      </div>`).join('');
    inner += `<div class="fav-popup-divider"></div>`;
  }
  inner += `
    <input class="fav-popup-input" id="fav-input-${id}" placeholder="New folder…">
    <button class="fav-popup-save" id="fav-save-${id}">Save</button>`;
  div.innerHTML = inner;

  const input = div.querySelector(`#fav-input-${id}`);
  const saveBtn = div.querySelector(`#fav-save-${id}`);
  const doSave = () => { const name = (input?.value||'').trim(); if (name) saveFav(id, name); };
  input?.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });
  saveBtn?.addEventListener('click', doSave);

  return div;
}

async function saveFav(id, folder) {
  closeAllPopups();
  try {
    await fetch(`/api/fav/${id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder }),
    });
  } catch(err) { return; }

  if (folder) favMap[id] = folder;
  else delete favMap[id];
  favFolders = [...new Set(Object.values(favMap))].sort();

  // Patch star button in-place
  const card = document.querySelector(`.tweet-card[data-id="${id}"]`);
  if (card) {
    const btn = card.querySelector('.star-btn');
    if (btn) {
      const isStarred = !!folder;
      btn.classList.toggle('active', isStarred);
      btn.title = isStarred ? `Saved in "${folder}" — click to remove` : 'Add to favourites';
      btn.innerHTML = isStarred
        ? `<svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    }
  }

  buildFavSidebar();
}

function closeAllPopups() {
  document.querySelectorAll('.fav-popup').forEach(p => p.remove());
  _openPopupId = null;
}
document.addEventListener('click', closeAllPopups);

function buildFavSidebar() {
  const section = document.getElementById('fav-section');
  if (!section) return;
  const total = Object.keys(favMap).length;
  if (!total) { section.style.display = 'none'; return; }
  section.style.display = '';

  const badge = document.getElementById('badge-fav-all');
  if (badge) badge.textContent = total;

  // Count per folder
  const counts = {};
  Object.values(favMap).forEach(f => { counts[f] = (counts[f]||0) + 1; });

  document.getElementById('fav-folder-list').innerHTML =
    Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([folder, count]) => `
      <div class="sidebar-fav-item" data-filter="fav:${esc(folder)}" onclick="setFilter('fav:${esc(folder)}',this)">
        <span class="sidebar-item-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
          ${esc(folder)}
        </span>
        <span class="fav-badge">${count}</span>
      </div>`).join('');
}

// ── Sync & Classify ────────────────────────────────────────────────────
let pollTimer = null;

async function doSyncAll() {
  const btn = document.getElementById('btn-syncall');
  if (btn.classList.contains('running')) return;
  try {
    const r = await fetch('/api/syncall', { method: 'POST' });
    const d = await r.json();
    if (!d.ok) { setActionStatus('syncall', 'error', d.msg); return; }
    setActionStatus('syncall', 'running', 'Connecting to X…');
    startPolling();
  } catch { setActionStatus('syncall', 'error', 'Server not reachable'); }
}

function setActionStatus(key, state, msg) {
  const btn = document.getElementById(`btn-${key}`);
  const stat = document.getElementById(`${key}-status`);
  const icon = document.getElementById(`${key}-icon`);
  btn.className = `action-btn ${state === 'idle' ? '' : state}`;
  stat.textContent = msg || '';
  if (icon) icon.classList.toggle('spin', state === 'running');
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollStatus, 3000);
}

async function pollStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();

    // Combined sync+classify status
    const syncRunning = d.sync.status === 'running';
    const classifyRunning = d.classify.status === 'running';
    const anyRunning = syncRunning || classifyRunning;

    if (syncRunning) {
      const msg = d.sync.log ? d.sync.log.split('\n').filter(Boolean).pop()?.trim().slice(0,40) : '';
      setActionStatus('syncall', 'running', msg || 'Syncing bookmarks…');
    } else if (classifyRunning) {
      setActionStatus('syncall', 'running', d.classify.progress || 'Classifying…');
    } else if (d.sync.status === 'error' || d.classify.status === 'error') {
      setActionStatus('syncall', 'error', 'Something went wrong');
    } else if (d.sync.status === 'done' || d.classify.status === 'done') {
      setActionStatus('syncall', 'done', 'Done ✓ — reloading…');
      setTimeout(() => { reloadData(); setActionStatus('syncall', 'idle', ''); }, 1500);
    }

    if (!anyRunning) { clearInterval(pollTimer); pollTimer = null; }
  } catch { /* server may be restarting */ }
}

async function reloadData() {
  try {
    const res = await fetch('bookmarks.json?t=' + Date.now());
    allBookmarks = await res.json();
    loadLocalState();
    buildSidebar();
    renderCatChips();
    buildFavSidebar();
    buildRightPanel();
    showStats();
    applyFilters();
  } catch {}
}

// Check on load if classify/sync is already running on the server
async function checkInitialStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (d.sync.status === 'running' || d.classify.status === 'running') {
      const msg = d.classify.status === 'running' ? (d.classify.progress || 'Classifying…') : 'Syncing…';
      setActionStatus('syncall', 'running', msg);
      startPolling();
    }
  } catch {}
}

// ── Kick off ───────────────────────────────────────────────────────────
init();
checkInitialStatus();
</script>
